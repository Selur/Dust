[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-dust'
dynamic = ['version']
description = 'Dust: limit-clipping spatiotemporal denoiser (FaeryDust, PixieDust, GoldDust, SpaceDust) for VapourSynth and AviSynth+'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.8'
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib', '*/*.a']
